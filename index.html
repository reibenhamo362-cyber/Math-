<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickSplit - מחשבון הוצאות קבוצתי</title>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 30, 46, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary: #10b981;
            --primary-hover: #059669;
            --accent: #3b82f6;
            --danger: #ef4444;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --input-bg: rgba(15, 23, 42, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Rubik', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(16, 185, 129, 0.12) 0%, transparent 35%),
                radial-gradient(circle at 85% 85%, rgba(59, 130, 246, 0.12) 0%, transparent 35%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px 10px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            text-align: center;
            padding: 10px 0 20px 0;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #34d399, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input, select {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
            width: 100%;
        }

        input:focus, select:focus {
            border-color: var(--primary);
        }

        button {
            background: var(--primary);
            color: #111827;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            white-space: nowrap;
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-whatsapp {
            background: #25d366;
            color: #fff;
            width: 100%;
            margin-top: 10px;
            font-size: 1.1rem;
        }

        .btn-whatsapp:hover {
            background: #1da851;
        }

        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            padding: 6px 14px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
        }

        .tag .remove-btn {
            cursor: pointer;
            color: var(--text-muted);
            font-size: 1.1rem;
            line-height: 1;
        }

        .tag .remove-btn:hover {
            color: var(--danger);
        }

        .expense-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--card-border);
        }

        .expense-item:last-child {
            border-bottom: none;
        }

        .expense-info h4 {
            font-size: 1rem;
            font-weight: 500;
        }

        .expense-info p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .expense-amount {
            font-weight: 700;
            color: var(--primary);
            font-size: 1.1rem;
        }

        .settlement-card {
            background: rgba(16, 185, 129, 0.05);
            border: 1px solid rgba(16, 185, 129, 0.2);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .settlement-text {
            font-size: 1.05rem;
        }

        .settlement-amount {
            font-weight: 700;
            color: #34d399;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 20px 0;
            font-size: 0.95rem;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
            .input-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>⚡ QuickSplit</h1>
            <p>חלוקת הוצאות חכמה וקיזוז חובות בלחיצת כפתור</p>
        </header>

        <!-- ניהול משתתפים -->
        <section class="card">
            <div class="card-title">👥 חברי הקבוצה</div>
            <div class="input-group">
                <input type="text" id="participantInput" placeholder="הכנס שם חבר/ה..." onkeypress="handleEnter(event, addParticipant)">
                <button onclick="addParticipant()">הוסף חבר</button>
            </div>
            <div id="participantsList" class="tags-container">
                <div class="empty-state">טרם הוספו חברים לקבוצה</div>
            </div>
        </section>

        <!-- הוספת הוצאה -->
        <section class="card">
            <div class="card-title">💳 הוספת הוצאה חדשה</div>
            <div class="input-group">
                <input type="text" id="expenseTitle" placeholder="על מה שילמתם? (דלק, אוכל...)">
                <input type="number" id="expenseAmount" placeholder="סכום (₪)" min="0">
            </div>
            <div class="input-group">
                <select id="expensePayer">
                    <option value="" disabled selected>מי שילם?</option>
                </select>
                <button onclick="addExpense()">הוסף הוצאה</button>
            </div>
        </section>

        <div class="grid-2">
            <!-- רשימת הוצאות -->
            <section class="card">
                <div class="card-title">📜 פירוט הוצאות</div>
                <div id="expensesList">
                    <div class="empty-state">אין הוצאות רשומות</div>
                </div>
            </section>

            <!-- סיכום וקיזוז חובות -->
            <section class="card">
                <div class="card-title">🎯 מנימום העברות (איזון)</div>
                <div id="settlementsList">
                    <div class="empty-state">הוסיפו משתתפים והוצאות כדי לראות חישוב</div>
                </div>
                <button class="btn-whatsapp" onclick="shareWhatsApp()">📱 שלח סיכום ב-WhatsApp</button>
            </section>
        </div>
    </div>

    <script>
        let participants = [];
        let expenses = [];

        function handleEnter(e, func) {
            if (e.key === 'Enter') func();
        }

        function addParticipant() {
            const input = document.getElementById('participantInput');
            const name = input.value.trim();
            if (!name) return;
            if (participants.includes(name)) {
                alert('שם זה כבר קיים בקבוצה!');
                return;
            }

            participants.push(name);
            input.value = '';
            updateUI();
        }

        function removeParticipant(name) {
            participants = participants.filter(p => p !== name);
            expenses = expenses.filter(e => e.payer !== name);
            updateUI();
        }

        function addExpense() {
            const titleInput = document.getElementById('expenseTitle');
            const amountInput = document.getElementById('expenseAmount');
            const payerSelect = document.getElementById('expensePayer');

            const title = titleInput.value.trim();
            const amount = parseFloat(amountInput.value);
            const payer = payerSelect.value;

            if (!title || isNaN(amount) || amount <= 0 || !payer) {
                alert('אנא מלא את כל שדות ההוצאה בצורה תקינה');
                return;
            }

            expenses.push({ id: Date.now(), title, amount, payer });

            titleInput.value = '';
            amountInput.value = '';
            payerSelect.value = '';
            updateUI();
        }

        function removeExpense(id) {
            expenses = expenses.filter(e => e.id !== id);
            updateUI();
        }

        function updateUI() {
            // Render Participants
            const pList = document.getElementById('participantsList');
            if (participants.length === 0) {
                pList.innerHTML = '<div class="empty-state">טרם הוספו חברים לקבוצה</div>';
            } else {
                pList.innerHTML = participants.map(p => `
                    <div class="tag">
                        <span>${p}</span>
                        <span class="remove-btn" onclick="removeParticipant('${p}')">&times;</span>
                    </div>
                `).join('');
            }

            // Render Select Options
            const select = document.getElementById('expensePayer');
            select.innerHTML = '<option value="" disabled selected>מי שילם?</option>' + 
                participants.map(p => `<option value="${p}">${p}</option>`).join('');

            // Render Expenses
            const eList = document.getElementById('expensesList');
            if (expenses.length === 0) {
                eList.innerHTML = '<div class="empty-state">אין הוצאות רשומות</div>';
            } else {
                eList.innerHTML = expenses.map(e => `
                    <div class="expense-item">
                        <div class="expense-info">
                            <h4>${e.title}</h4>
                            <p>שולם ע"י: ${e.payer}</p>
                        </div>
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <span class="expense-amount">₪${e.amount.toFixed(2)}</span>
                            <span class="remove-btn" style="cursor:pointer; color: var(--danger)" onclick="removeExpense(${e.id})">&times;</span>
                        </div>
                    </div>
                `).join('');
            }

            // Calculate Settlements
            calculateSettlements();
        }

        function calculateSettlements() {
            const sList = document.getElementById('settlementsList');
            if (participants.length < 2 || expenses.length === 0) {
                sList.innerHTML = '<div class="empty-state">נדרשים לפחות 2 חברים והוצאה אחת לחישוב</div>';
                return;
            }

            // Calculate net balance for each person
            const balances = {};
            participants.forEach(p => balances[p] = 0);

            const totalAmount = expenses.reduce((sum, e) => sum + e.amount, 0);
            const sharePerPerson = totalAmount / participants.length;

            expenses.forEach(e => {
                balances[e.payer] += e.amount;
            });

            participants.forEach(p => {
                balances[p] -= sharePerPerson;
            });

            // Separate debtors and creditors
            let debtors = [];
            let creditors = [];

            for (let p in balances) {
                if (balances[p] < -0.01) debtors.push({ name: p, amount: -balances[p] });
                if (balances[p] > 0.01) creditors.push({ name: p, amount: balances[p] });
            }

            // Minimize transfers
            const settlements = [];
            let i = 0, j = 0;

            while (i < debtors.length && j < creditors.length) {
                let debtor = debtors[i];
                let creditor = creditors[j];
                let amount = Math.min(debtor.amount, creditor.amount);

                settlements.push({
                    from: debtor.name,
                    to: creditor.name,
                    amount: amount
                });

                debtor.amount -= amount;
                creditor.amount -= amount;

                if (debtor.amount < 0.01) i++;
                if (creditor.amount < 0.01) j++;
            }

            if (settlements.length === 0) {
                sList.innerHTML = '<div class="empty-state">כולם מאוזנים! אף אחד לא חייב כלום.</div>';
                return;
            }

            window.currentSettlements = settlements;

            sList.innerHTML = settlements.map(s => `
                <div class="settlement-card">
                    <div class="settlement-text">
                        <strong>${s.from}</strong> ➔ <strong>${s.to}</strong>
                    </div>
                    <div class="settlement-amount">₪${s.amount.toFixed(2)}</div>
                </div>
            `).join('');
        }

        function shareWhatsApp() {
            if (!window.currentSettlements || window.currentSettlements.length === 0) {
                alert('אין נתוני העברות לניכוי עדיין!');
                return;
            }

            let text = "⚡ *סיכום הוצאות QuickSplit* ⚡\n\n";
            text += "*הוראות העברה לאיזון החשבון:*\n";

            window.currentSettlements.forEach(s => {
                text += `• *${s.from}* מעביר/ה ל-*${s.to}*: ₪${s.amount.toFixed(2)}\n`;
            });

            text += "\nנוצר באמצעות QuickSplit 🚀";

            const url = `https://wa.me/?text=${encodeURIComponent(text)}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
